    /* Pastel Pink Glow & Animated Outline Button Class */
    .attention-btn {
      background-color: #ffb7b2;

      outline: 2px dashed #ffb7b2;
      outline-offset: 4px;
      animation: pulseOutline 2s infinite linear;
    }

    .attention-btn {
      background-color: #ffb7b2;
      box-shadow: 0 0 15px rgba(255, 183, 178, 0.6);
      position: relative;
      border: none;
      /* We use a gradient outline trick for the continuous moving effect */
      outline: 3px solid transparent;
      background-image: linear-gradient(#ffb7b2, #ffb7b2), 
                        linear-gradient(90deg, #ffb7b2, #ffffff, #ff9e99, #ffb7b2);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      background-size: 200% 100%;
      animation: moveOutline 3s infinite linear, pulseGlow 2s infinite ease-in-out;
    }

    .attention-btn:hover {
      background-color: #ffc6c2;
      background-image: linear-gradient(#ffc6c2, #ffc6c2), 
                        linear-gradient(90deg, #ffc6c2, #ffffff, #ff857f, #ffc6c2);
    }

    /* Animates the outline so it looks like light is travelling around the border */
    @keyframes moveOutline {
      0% {
        background-position: 0% 0%, 0% 0%;
      }
      100% {
        background-position: 0% 0%, -200% 0%;
      }
    }

    /* Animates the soft pastel glow to breath in and out */
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 12px 2px rgba(255, 183, 178, 0.5);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 25px 6px rgba(255, 183, 178, 0.9);
        transform: scale(1.04);
      }
    }

    @keyframes modalFade { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .close { color: #535f46; float: left; font-size: 22px; font-weight: bold; cursor: pointer; transition: ease 0.3s;}

    .modal-content h3 { margin-bottom: 20px; font-family: 'Aref Ruqaa', serif; font-size: 24px; color: #2f4931; }

    }
    .download-option:hover { background-color: #408345; }
    .button-group { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }

    /* Container to handle responsive image sizing */

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPU6aB0BMPAC_mw4BLBu0naRkFdhl5ZpQ",
      authDomain: "avvaluhsaanavee.firebaseapp.com",
      projectId: "avvaluhsaanavee",
      storageBucket: "avvaluhsaanavee.firebasestorage.app",
      messagingSenderId: "274473127808",
      appId: "1:274473127808:web:ac21c010b28b57ca53fb65"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = './login';
      }
    });

    const logoutBtn = document.getElementById('logoutBtn');
    logoutBtn.addEventListener('click', () => {
      signOut(auth).then(() => {
        window.location.href = './login';
      }).catch(error => alert(error.message));
    });
  </script>
  <script>
    document.querySelectorAll('.card').forEach((card, i) => {
      card.style.animationDelay = `${0.15 * (i + 1)}s`;
    });

    function openModal(subject, lessons) {
      const modal = document.getElementById("downloadModal");
      const title = document.getElementById("modal-title");
      const list = document.getElementById("downloadList");

      title.innerText = `دروس ال${subject}`;
      list.innerHTML = "";

      lessons.forEach((lesson) => {
        const btn = document.createElement("a");
        btn.href = lesson.file;
        btn.target = "_blank";
        btn.innerHTML = `<button class="download-option">${lesson.name}</button>`;
        list.appendChild(btn);
      });

      modal.style.display = "block";
      modal.setAttribute("aria-hidden", "false");
    }

    /* time table modal */
    function openImageModal(titleText, imgSrc) {
      const modal = document.getElementById("downloadModal");
      const modalContent = modal.querySelector(".modal-content");
      const title = document.getElementById("modal-title");
      const list = document.getElementById("downloadList");
    
      modalContent.classList.add("image-modal-content");
    
      title.innerText = titleText;

      list.innerHTML = `<div class="image-container"><img src="${imgSrc}" alt="${titleText}" class="preview-img"></div>`;
    
      modal.style.display = "block";
      modal.setAttribute("aria-hidden", "false");
    }
    
    function closeModal() {
      const modal = document.getElementById("downloadModal");
      const modalContent = modal.querySelector(".modal-content");
      
      modal.style.display = "none";
      modal.setAttribute("aria-hidden", "true");
      
      modalContent.classList.remove("image-modal-content");
    }

    window.onclick = function(event) {
      const modal = document.getElementById("downloadModal");
      if (event.target === modal) {
        closeModal();
      }
    };

    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const sideMenu = document.getElementById('sideMenu');
    const closeMenuBtn = document.getElementById('closeMenuBtn');
    const menuOverlay = document.getElementById('menuOverlay');

    function openMenu() {
      sideMenu.classList.add('open');
      menuOverlay.classList.add('active');
      menuToggleBtn.style.opacity = '0';
      menuToggleBtn.style.pointerEvents = 'none';
    }

    function closeSideMenu() {
      sideMenu.classList.remove('open');
      menuOverlay.classList.remove('active');
      menuToggleBtn.style.opacity = '1';
      menuToggleBtn.style.pointerEvents = 'auto';
    }

    menuToggleBtn.addEventListener('click', openMenu);
    closeMenuBtn.addEventListener('click', closeSideMenu);
    menuOverlay.addEventListener('click', closeSideMenu);
  </script>
