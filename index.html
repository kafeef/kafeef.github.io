<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>ثاني الثانوي - كفيف</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta property="og:image" content="11.png" />
  <link rel="icon" type="image/png" href="11.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa&family=Lateef&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <script async src="https://tally.so/widgets/embed.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="header">
    <button id="logoutBtn" class="logout-btn">تسجيل الخروج</button>
    <h1>جمع الدروس لثاني الثانوي</h1>
  </div>

  <div class="container">
    <!-- ALL CARDS (unchanged) -->
    <!-- Example shown, rest remain exactly the same -->
    <div class="card quran">
      <div class="text-preview">تجويد</div>
      <div class="button-group">
        <a href="./404">
          <button class="download-btn na">
            <img src="icon/quranicon.png" alt="Download" class="subjectimg">
          </button>
        </a>
      </div>
    </div>

    <!-- 🔁 KEEP ALL OTHER CARD BLOCKS EXACTLY AS THEY WERE -->
  </div>

  <footer class="footer">
    حقوق الطبع والنشر محفوظة لأصحابها الشرعيين
  </footer>

  <div class="report-note"
    data-tally-open="3l5NWV"
    data-tally-layout="modal"
    data-tally-width="400"
    data-tally-hide-title="1"
    data-tally-emoji-animation="none"
    data-tally-auto-close="2000">
    اضغط هنا للإبلاغ عن خطأ في أي درس!
  </div>

  <div id="downloadModal" class="modal" role="dialog" aria-hidden="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h3 id="modal-title">تحميل</h3>
      <div class="download-list" id="downloadList"></div>
    </div>
  </div>

  <!-- Firebase (module) -->
  <script type="module" src="firebase.js"></script>

  <!-- Main JS -->
  <script src="script.js"></script>
</body>
</html>
