<!DOCTYPE html>
<html lang="ar" direction="rtl">
<head>
  <meta charset="UTF-8" />
  <title>إنشاء فلاش - كفيف</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta property="og:image" content="11.png" />
  <link rel="icon" type="image/png" href="11.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
   <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa&family=Lateef&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #1b4332;
      --primary-light: #2d6a4f;
      --accent-color: #d4a373;
      --accent-hover: #c39262;
      --bg-gradient: linear-gradient(135deg, #e6f7d3 0%, #ecfadc 100%);
      --card-front-bg: #ffffff;
      --card-back-bg: #e8f5e9;
      --text-dark: #132a13;
      --success-color: #52b788;
      --danger-color: #e91f30;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Lateef', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      direction: rtl;
      color: var(--text-dark);
    }
    
    .app-container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 5px;
      animation: fadeInDown 0.6s ease-out;
    }

    h1 {
      font-family: 'Aref Ruqaa', serif;
      font-size: 44px;
      color: var(--primary-color);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.03);
      margin-bottom: 5px;
    }

    .dashboard {
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      padding: 15px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.9);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .thafaas {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 22px;
      color: var(--primary-light);
    }

    .dharaja {
      display: flex;
      gap: 12px;
    }

    .score-badge {
      padding: 2px 10px;
      border-radius: 12px;
      color: white;
      font-size: 21px;
    }
    .score-badge.mastered { background-color: var(--success-color); }
    .score-badge.review { background-color: #afbda9; color: var(--text-dark); }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--success-color), var(--primary-light));
      border-radius: 10px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .flashcard-wrapper {
      perspective: 1200px;
      width: 100%;
      height: 380px;
      cursor: pointer;
    }

    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .flashcard.flipped {
      transform: rotateY(180deg);
    }

    .card-side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 28px;
      padding: 35px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 15px 35px rgba(27, 67, 50, 0.06);
      border: 2px solid rgba(255,255,255,0.8);
      overflow-y: auto;
    }

    .flashcard-wrapper:hover .card-side {
      box-shadow: 0 25px 50px rgba(27, 67, 50, 0.15);
    }

    .side-front {
      background: var(--card-front-bg);
      color: var(--primary-color);
    }

    .side-back {
      background: var(--card-back-bg);
      color: var(--text-dark);
      transform: rotateY(180deg);
      border: 2px dashed var(--primary-light);
    }

    .side-hint {
      font-size: 12px;
      position: absolute;
      top: 20px;
      background: rgba(0, 0, 0, 0.04);
      padding: 4px 14px;
      border-radius: 30px;
      color: #555;
    }

    .card-text {
      font-size: 28px;
      line-height: 1.6;
      white-space: pre-line;
      word-break: break-word;
    }

    .assessment-row {
      display: flex;
      gap: 15px;
      width: 100%;
      animation: fadeIn 0.5s ease;
    }

    .assess-btn {
      flex: 1;
      font-family: 'Lateef', sans-serif;
      font-size: 20px;
      border: none;
      padding: 12px;
      border-radius: 16px;
      cursor: pointer;
      color: white;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .assess-btn.know { background-color: var(--success-color); }
    .assess-btn.know:hover { background-color: #40a073; }
    .assess-btn.dont-know { background-color: var(--danger-color); }
    .assess-btn.dont-know:hover { background-color: #d62839; }

    .controls-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .main-controls {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .game-btn {
      font-family: 'Lateef', sans-serif;
      font-size: 24px;
      border: none;
      padding: 14px 22px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.03);
    }

    .btn-nav {
      background-color: var(--primary-color);
      color: white;
      flex: 2;
    }
    .btn-nav:hover:not(:disabled) {
      background-color: var(--primary-light);
    }

    .btn-flip {
      background-color: var(--accent-color);
      color: white;
      flex: 3;
    }
    .btn-flip:hover {
      background-color: var(--accent-hover);
    }

    .btn-utility {
      background-color: rgba(255, 255, 255, 0.8);
      color: var(--text-dark);
      border: 1px solid rgba(0,0,0,0.06);
      width: 100%;
      font-size: 22px;
    }
    .btn-utility:hover {
      background-color: #ffffff;
      color: var(--primary-light);
    }

    .game-btn:disabled {
      background-color: #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .celebration-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(27, 67, 50, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .celebration-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .celebration-box {
      background: white;
      color: var(--text-dark);
      padding: 40px 30px;
      border-radius: 28px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      transform: scale(0.8);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .celebration-overlay.active .celebration-box {
      transform: scale(1);
    }
    .celebration-title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 45px;
      color: var(--primary-color);
      margin-bottom: 15px;
    }

    .footer {
      font-family: 'Aref Ruqaa', serif;
      text-align: center;
      margin-top: 50px;
      padding: 20px 0;
      font-size: 20px;
      color: #2f4931;
      opacity: 0.7;
      border-top: 1px solid #ccc;
      width: 100%;
      max-width: 600px;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 600px) {
      h1 { font-size: 32px; }
      .flashcard-wrapper { height: 340px; }
      .card-text { font-size: 20px; }
      .main-controls { flex-direction: column; }
      .game-btn { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="header">
      <h1>الإنشاء</h1>
    </div>

    <div class="dashboard">
      <div class="thafaas">
        <div id="progressPercentage">التقدم الفعلي: 0%</div>
        <div class="dharaja">
          <span class="score-badge mastered" id="masteredCount">عرفتها: 0</span>
          <span class="score-badge review" id="cardProgress">البطاقة 0 من 0</span>
        </div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>

    <div class="flashcard-wrapper" onclick="toggleCardFlip()">
      <div class="flashcard" id="flashcardElement">
        <div class="card-side side-front">
          <span class="side-hint">السؤال</span>
          <div class="card-text" id="questionDisplay">جاري التحميل...</div>
        </div>
        <div class="card-side side-back">
          <span class="side-hint">الإجابة</span>
          <div class="card-text" id="answerDisplay">-</div>
        </div>
      </div>
    </div>

    <div class="assessment-row" id="assessmentRow" style="visibility: hidden;">
      <button class="assess-btn know" onclick="markCard(true)">عرفت الإجابة</button>
      <button class="assess-btn dont-know" onclick="markCard(false)">أحتاج لمراجعتها</button>
    </div>

    <div class="controls-container">
      <div class="main-controls">
        <button class="game-btn btn-nav" id="prevCardBtn" onclick="event.stopPropagation(); changeCard(-1)">السابقة</button>
        <button class="game-btn btn-flip" id="flipCardBtn" onclick="event.stopPropagation(); toggleCardFlip();">قلب</button>
        <button class="game-btn btn-nav" id="nextCardBtn" onclick="event.stopPropagation(); changeCard(1)">التالية</button>
      </div>
      
      <button style="background-color: rgb(241, 45, 45); color: #ffffff;" class="game-btn btn-utility" onclick="event.stopPropagation(); shuffleCards()">خلط البطاقات عشوائياً</button>
    </div>

    <footer class="footer">
      حقوق الطبع والنشر محفوظة لأصحابها الشرعيين
    </footer>

  </div>

  <div class="celebration-overlay" id="celebrationOverlay">
    <div class="celebration-box">
      <div class="celebration-title">صفق نفسك! (بالسبابتان)</div>
      <p style="font-size: 20px; margin-bottom: 20px; line-height: 1.6;">بسم الله ماشاءالله! ما هذه الاجابات الجميالة. لا أحد يستطيع أن يكون مثلك</p>
      <div style="background: #f4fbf4; padding: 15px; border-radius: 16px; margin-bottom: 25px; color: var(--primary-color);" id="finalScoreText">
        البطاقات التي عرفتها: 0 من 0
      </div>
      <button class="game-btn btn-flip" style="width:100%;" onclick="restartDeck()">إعادة المذاكرة من جديد</button>
    </div>
  </div>

  <script>
    let flashcards = [
      { q: "ما فائدة علم الإنشاء؟", a: "١ - له أثر واضح في تأدية الأغراض.\n٢ - الإعراب عما يدور في الذهن.\n٣ - الحفاظ على العلوم والمعارف بتدوينها.\n٤ - يوسع ويعمق أفكار المتعلمين." },
      { q: "عرف الإنشاء؟", a: "العلم الذي يعرف به كيفية جمع المعاني والتأليف بينها وتنسيقها والتعبير عنها بعبارات بليغة." },
      { q: "ما هي المراحل في الإنشاء？", a: "(١) مرحلة التفكير\n(٢) مرحلة الصياغة أو الكتابة\n(٣) مرحلة الانتقادات والتصويبات أو المراجعة" },
      { q: "ما المقصود بمرحلة التفكير ؟", a: "أي إعمال الفكر في التعرف على الموضوع وما يتفرع عنه من أفكار جزئية واعية." },
      { q: "بم تقسم مرحلة التفكير؟", a: "أ- الشمول\nب - التنسيق\nج- التهذيب\nد - الترتيب المنطقي." },
      { q: "ما المقصود بمرحلة الصياغة؟", a: "ويتم فيها التزاوج بين المعاني والألفاظ وذلك عن طريق اختيار الألفاظ المعبرة عن معانيها ونظمها في جمل بليغة." },
      { q: "ما المقصود بمرحلة الانتقادات والتصويبات؟", a: "فيها يتم إعادة النظر فيما كتب وحذف ما ينبغي حذفه." },
      { q: "مم يتكون موضوع الإنشاء؟ / ما عناصر الإنشاء؟", a: "١ - مقدمة الموضوع: وفيها يذكر التعريف بالموضوع والهدف منه.\n٢ - صلب الموضوع: وفيه يكون الحديث عن كل فكرة من الأفكار الجزئية التي يتكون منها مجموعها الموضوع.\n- الخاتمة: وفيها يتم تلخيص الموضوع وتقديم المقترحات والتوصيات." },
      { q: "ما هي تقسيمات الإنشاء باعتبار الوسيلة التي يؤدي بها؟", a: "ينقسم إلى قسمين:\nالأول: الإنشاء الشفهي: ووسيلته اللسان ومن أمثلته المحادثة - المناظرة – الخطابة – المحاضرة.\nالثاني: الإنشاء التحريري: ووسيلته القلم ومن أنواعه المقال بأنواعه، والمراسلات." },
      { q: "ما هي تقسيمات الإنشاء بحسب الغرض منه？", a: "ينقسم إلى قسمين:\nالأول: الإنشاء الوظيفي: وهو ذلك النوع من التعبير الذي يحتاج إليه الإنسان في حياته العلمية والعملية والاجتماعية، مثل كتابة الرسائل والسير والمحاضرات.\nالثاني: الإنشاء الإبداعي: وهو ذلك النوع الذي يعبر عن المشاعر والأحاسيس والخواطر النفسية بأسلوب مثير مشوق، مثل كتابة الشعر والتراجم والقصص الأدبي والمقال الأدبي." },
      { q: "ما هي وسائل تنمية ملكة الإنشاء؟", a: "تنمى الملكة الإنشائية بعدة وسائل منها:\n١ - السماع الجيد للألفاظ واللغة وأصواتها وأساليبها من المحسنين تجنباً للأداءات الهجينة.\n٢ - مطالعة النصوص الفصيحة وحفظها لتنمية الثروة اللغوية.\n٣ - الفهم الدقيق لمدلولات الألفاظ في سياقها وعلاقة الجمل بعضها ببعض.\n٤ - حل الشعر وعقد النثر: أي تسيير الشعر نثراً والنثر نظماً.\n٥ - التدريب على التعبير في أنواع الإنشاء المتنوعة ليسهل تناولها عند إرادتها." },
      { q: "ما هو تعريف الإنشاء الشفهي؟ وما هي وسيلته؟", a: "هو ذلك النوع الذي يعبر عما يدور في الذهن من أفكار عن طريق الأصوات اللغوية، ووسيلته هي اللسان." },
      { q: "كم نوعاً للإنشاء الشفهي؟ اذكرها.", a: "الإنشاء الشفهي نوعان:\n١ - الإنشاء الشفهي المباشر: وهو الذي يكون بين المتكلم والمخاطب مواجهة.\n٢ - الإنشاء الشفهي غير المباشر: وهو الذي يكون بين المتكلم والمخاطب عبر وسائل الاتصال." },
      { q: "ما هي الأهمية التاريخية والإنسانية للإنشاء الشفهي المباشر؟", a: "يعد الإنشاء الشفهي المباشر هو الشكل الأول من أشكال الاتصال الإنساني." },
      { q: "لماذا لا يزال الاتصال الشفهي المباشر يحدث أثراً لا تستطيع الأجهزة الإعلامية أن تقوم به؟", a: "وذلك لأن المحدث يستطيع أن يتفاعل مع مستمعيه حينما يستجيبون له، كما أن المستمعين يؤثر بعضهم في بعض بما يصدر عنهم من انفعالات ظاهرة أو إشارات أو تعليقات." },
      { q: "هل لوسائل الاتصال الشفهي غير المباشر دور مهم أيضاً؟ اذكر أمثلة.", a: "نعم، فقد أثبتت وسائل الاتصال الشفهي غير المباشر كالإذاعة والتلفاز دوراً مهماً لا يقل أهمية عن وسائل الاتصال المباشر." },
      { q: "عرف المناظرة كما وردت عن التهانوي؟", a: "المناظرة كما عرفها التهانوي: علم يعرف به كيفية إثبات المطلوب أو نفيه أو نفي دليله مع الخصم القائم على الأدلة المنطقية حتى ينتهي بانتصار أحدهما على الآخر." },
      { q: "ما هي أنواع المناظرة؟", a: "نوعان:\nأ - مناظرة واقعية: وهي التي تدور حول موضوع معين له واقع كالمناظرة التي جرت بين سيدنا إبراهيم - عليه السلام - وملك زمانه.\nب - مناظرة خيالية: وهي التي تعتمد في مضمونها على الخيال كالمناظرة بين الربيع والخريف والماء والهواء." },
      { q: "ما هي شروط عقد المناظرة؟", a: "١ - أن تكون في موضوع محدد له أهميته.\n٢ - أن يجمع فيها بين خصمين أي مختلفين أو موضوعين متباينين في صفاتها.\n٣ - أن يسعى كل خصم في نصرة نفسه وتفنيد مزاعم خصمه." },
      { q: "ما هو تعريف الخطابة؟", a: "هي إلقاء الكلام المنثور سجعاً أو مرسلاً لاستمالة السامعين إلى رأي أو ترغيبهم في عمل." },
      { q: "اذكر أصول الخطابة الأساسية؟", a: "للخطابة أصول كثيرة منها:\n١ - وحدة الموضوع: أن يكون للخطبة موضوع واحد واضح غير متشعب الأطراف ولا متعدد القضايا.\n٢ - تأخي الأفكار: أن تكون عناصر الخطبة متوائمة بحيث يسلم كل عنصر فيها إلى الآخر في تسلسل منطقي مقبول.\n٣ - مراعاة الحال: أن تتواءم الخطبة وحال الناس بحيث تتناول قضية من القضايا التي تشغل الرأي العام.\n٤ - جودة الأسلوب: أن تكون الألفاظ سهلة المأخذ والجمل شديدة الارتباط قريبة التآخي دون تطويل أو استطراد.\n٥ - حسن الإلقاء: ألا يستمر الخطيب على حال واحدة في النطق بل تكون الجمل تفاوتة في مظاهرها." },
      { q: "ما أهمية جودة إلقاء الخطبة؟", a: "هي التي تجعل لسماعها فضلاً على قراءتها في صحيفة، حيث يجد الناس في سماعها من الارتياح فوق ما يجدونه عندما يقرؤونها أو يستمعون إلى من يسردها سرداً." },
      { q: "ما أنواع الخطابة في الإسلام باعتبار الموضوع؟", a: "١ - الخطبة السياسية.\n٢ - الخطبة الاجتماعية." },
      { q: "ما هي مكونات وأجزاء الخطبة？", a: "١ - الديباجة: وهي فاتحة الخطبة التي تشتمل على الحمد والثناء على الله، والصلاة والسلام على رسوله.\n٢ - صلب الخطابة: وفيه يتم تناول الأفكار الجزئية بعناية وافية ومفيدة، ويجب أن تشتمل على القرآن الكريم والسنة النبوية وأقوال الصحابة والتابعين.\n٣ - الخاتمة: ويحسن فيها أن تكون كلاماً جامعاً لما ورد في الخطبة." },
      { q: "ما الكتب الخارجية التي يستعان بها لإعداد خطبة بليغة؟", a: "١ - كتاب رياض الصالحين للنووي.\n٢ - كتاب الترغيب والترهيب للمنذري.\n٣ - كتاب مفتاح الخطابة والوعظ للعدوي.\n٤ - موسوعة نضرة النعيم في أخلاق الرسول الكريم المجموعة من العلماء." },
      { q: "عرف المحاضرة؟", a: "عبارة عن معلومات منسقة تعالج موضوعاً معيناً معالجة علمية سديدة." },
      { q: "ما هي أنواع المحاضرة؟", a: "١ - المحاضرة العامة: وهي التي تلقى لمعالجة موضوع من الموضوعات العامة غير المتخصصة بطائفة من الناس مثل المحافظة على البيئة.\n٢ - المحاضرة الخاصة: وهي التي تعالج موضوعاً خاصاً في مجتمع خاص وتقسم إلى (جامعية، ثقافية، وعلمية)." },
      { q: "ما أقسام المحاضرة الخاصة الدقيقة؟", a: "أ - المحاضرة الجامعية: وهي التي تلقى في جماعة من الطلاب لمعالجة موضوع دراسي معين.\nب - المحاضرة الثقافية: وهي التي تخاطب فئة معينة لإيضاح موضوع معين.\nج - المحاضرة العلمية: وهي التي تلقى في منتدى علمي لإثبات نظرية علمية معينة." },
      { q: "ما الذي ينبغي مراعاته في المحاضرة؟", a: "١ - وحدة الموضوع.\n٢ - الإفادة وسمو الهدف.\n٣ - الملاءمة للفئة المستهدفة.\n٤ - الإعداد الجيد." },
      { q: "ما أسلوب المحاضرة؟ وما يجب أن يستخدمه المحاضر؟", a: "١ - اللغة الفصحى.\n٢ - الأسلوب العلمي القائم على الأدلة.\n٣ - اللهجة الهادئة.\n٤ - الأسلوب الحواري البناء مع الفئة المستهدفة.\n٥ - الوسائل المعينة على الإيضاح." },
      { q: "ما هي سلوكيات الفئة المستهدفة (المستمعين) لإنجاح المحاضرة؟", a: "١ - الإنصات الجيد.\n٢ - تدوين الملاحظات ومناقشتها مع المحاضر في الوقت المتفق عليه.\n٣ - المحافظة على المبادئ العامة التي تساعد على إخراج المحاضرة على الصورة المثالية." },
      { q: "ما هي مكونات المحاضرة الثلاثة؟", a: "١ - التمهيد.\n٢ - صلب المحاضرة.\n٣ - الخاتمة." },
      { q: "ما هي مواضع استعمال علامة الترقيم: الفاصلة ( ، )؟", a: "(١) بين المفردات المعطوفة لبيان أقسام الشيء.\n(٢) بين المفردات المعطوفة، إذا تعلق بها ما يطيل عبارتها.\n(٣) بين الجمل المعطوفة القصيرة ولو كان كل منها لغرض مستقل.\n(٤) بين جمل الشرط والجزاء أو بين القسم وجوابه.\n(٥) بين الجملتين المرتبطتين في اللفظ والمعنى.\n(٦) بعد المنادى." },
      { q: "ما هي مواضع استعمال الفاصلة المنقوطة ( ؛ )؟", a: "(١) بين الجمل الطويلة التي يتألف من مجموعها كلام مفيد.\n(٢) بين جملتين تكون الثانية منها سبباً في الأولى، أو تكون الثانية مسببة عن الأولى (مثل: فهمت علامات الترقيم؛ لأنها مفيدة)." },
      { q: "ما هي استعمالات علامة الترقيم: النقطة ( . )؟", a: "توضع في نهاية الجملة تامة المعنى والمنتهية (مثل: خير الكلام ما قل ودل)." },
      { q: "ما هي مواضع استعمال النقطتين الرأسيتين ( : )؟", a: "(١) توضع بين القول ومدلوله (مثل: قال حكيم: ).\n(٢) بين الشيء وأقسامه.\n(٣) قبل الكلام الذي يوضح ويصنف ما قبله." },
      { q: "ما هي استعمالات علامة الاستفهام ( ؟ )؟", a: "توضع في نهاية الجمل المستفهم بها (مثل: متى حضرتك؟ أهذا خطك؟)." },
      { q: "متى تستعمل علامة التأثر ( ! )؟", a: "توضع في نهاية الجمل التي يعبر بها عن عاطفة أو شعور (كالفرح، الحزن، التعجب، الاستنكار، الدعاء، الإعجاب، التفجع، المدح، أو الذم)." },
      { q: "ما هي استعمالات القوسين ( ) أو الشرطتان ( - - )؟", a: "يوضعان لحصر الجمل الاعتراضية، أو لألفاظ الاحتراس لمنع اللبس والغموض." },
      { q: "ما هي فائدة علامة التخصيص ( \" \" )؟", a: "يوضع بين قوسيها الكلام الذي ينقل بنصه وحروفه بدقة وعناية دون تغيير (مثل الآيات والأحاديث الكريمة)." },
      { q: "ما هي استعمالات الشرطة التقليدية ( - )؟", a: "تستعمل للتفريق بين العدد والمعدود (مثل: أولاً- ثانياً-)، وفي أول السطر إذا وقعا عنواناً ممتداً." },
      { q: "ما هي فائدة علامة الحذف ( ... )؟", a: "توضع مكان الكلام المحذوف من السياق دلالة على الاختصار والتبسيط أو لاختبار وبناء أسئلة الطلاب." },
      { q: "ما هي فائدة واستعمال علامة المماثلة ( = )؟", a: "توضع مباشرة أسفل الكلام المتماثل في السطور المتتالية استغناءً عن تكرار الكتابة واختصاراً للجهد والوقت." }
    ];

    let currentCardIndex = 0;
    let masteredCards = new Set(); 

    window.onload = function() {
      renderCard();
    };

    function renderCard() {
      const total = flashcards.length;
      const progressPercent = total > 1 ? Math.round((currentCardIndex / (total - 1)) * 100) : 0;
      
      document.getElementById("progressPercentage").innerText = `التقدم الفعلي: ${progressPercent}%`;
      document.getElementById("cardProgress").innerText = `البطاقة ${currentCardIndex + 1} من ${total}`;
      document.getElementById("progressBarFill").style.width = `${progressPercent}%`;
      document.getElementById("masteredCount").innerText = `عرفتها: ${masteredCards.size}`;

      document.getElementById("questionDisplay").innerText = flashcards[currentCardIndex].q;
      document.getElementById("answerDisplay").innerText = flashcards[currentCardIndex].a;

      document.getElementById("prevCardBtn").disabled = (currentCardIndex === 0);
      document.getElementById("nextCardBtn").disabled = (currentCardIndex === total - 1);
    }

    function toggleCardFlip() {
      const card = document.getElementById("flashcardElement");
      card.classList.toggle("flipped");
      
      const assessRow = document.getElementById("assessmentRow");
      if (card.classList.contains("flipped")) {
        assessRow.style.visibility = "visible";
      } else {
        assessRow.style.visibility = "hidden";
      }
    }

    function resetCardFlip() {
      document.getElementById("flashcardElement").classList.remove("flipped");
      document.getElementById("assessmentRow").style.visibility = "hidden";
    }

    function changeCard(direction) {
      const targetIndex = currentCardIndex + direction;
      if (targetIndex >= 0 && targetIndex < flashcards.length) {
        resetCardFlip();
        setTimeout(() => {
          currentCardIndex = targetIndex;
          renderCard();
        }, 180);
      }
    }

    function markCard(isMastered) {
      if (isMastered) {
        masteredCards.add(currentCardIndex);
      } else {
        masteredCards.delete(currentCardIndex);
      }
      
      if (currentCardIndex < flashcards.length - 1) {
        changeCard(1);
      } else {
        document.getElementById("finalScoreText").innerText = `البطاقات التي عرفتها بشكل متقن: ${masteredCards.size} من أصل ${flashcards.length}`;
        document.getElementById("celebrationOverlay").classList.add("active");
      }
    }

    function shuffleCards() {
      resetCardFlip();
      setTimeout(() => {
        for (let i = flashcards.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
        }
        currentCardIndex = 0;
        masteredCards.clear();
        renderCard();
        alert("تم إعادة ترتيب البطاقات عشوائياً.");
      }, 200);
    }

    function restartDeck() {
      document.getElementById("celebrationOverlay").classList.remove("active");
      currentCardIndex = 0;
      masteredCards.clear();
      resetCardFlip();
      renderCard();
    }

    window.addEventListener("keydown", function(e) {
      if (e.code === "Space") {
        e.preventDefault(); 
        toggleCardFlip();
      } else if (e.key === "ArrowRight") {
        changeCard(-1); 
      } else if (e.key === "ArrowLeft") {
        changeCard(1);  
      }
    });
  </script>
